[package]
name = "gradebook"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "A gradebook with weighted averages for teachers and homeschoolers"
publish = false

# Debian/Ubuntu package: `cargo build --release && cargo deb --no-build`.
[package.metadata.deb]
name = "gradebook"
maintainer = "JMTDI <JMTDI@users.noreply.github.com>"
section = "education"
priority = "optional"
extended-description = """\
GradeBook keeps track of students' grades by grade level, period and subject, and \
calculates weighted averages with letter grades. Backup and Restore save and load the \
whole gradebook as a single file."""
# `$auto` covers what the binary links against (fontconfig, libc, ...). The X11
# libraries are loaded at run time by the windowing code, so they are listed here.
depends = "$auto, libx11-6, libx11-xcb1, libxcb1, libxcb-xkb1, libxcursor1, libxext6, libxfixes3, libxi6, libxrender1, libxkbcommon0, libxkbcommon-x11-0"
# Wayland sessions, and a file chooser for Backup/Restore (a desktop portal or zenity).
recommends = "libwayland-client0, libwayland-cursor0, xdg-desktop-portal | zenity"
assets = [
    ["target/release/gradebook", "usr/bin/gradebook", "755"],
    ["packaging/linux/com.jmtditech.gradebook.desktop", "usr/share/applications/com.jmtditech.gradebook.desktop", "644"],
    ["assets/icons/icon-16.png", "usr/share/icons/hicolor/16x16/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-24.png", "usr/share/icons/hicolor/24x24/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-32.png", "usr/share/icons/hicolor/32x32/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-64.png", "usr/share/icons/hicolor/64x64/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/com.jmtditech.gradebook.png", "644"],
    ["assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/com.jmtditech.gradebook.png", "644"],
    ["ui/fonts/Inter-OFL.txt", "usr/share/doc/gradebook/Inter-OFL.txt", "644"],
    ["README.md", "usr/share/doc/gradebook/README.md", "644"],
]

[lib]
name = "gradebook"
path = "src/lib.rs"

[[bin]]
name = "gradebook"
path = "src/main.rs"

[dependencies]
# Local dates for the backup names and the printed report. Slint already builds it with the
# same feature, so this adds no package.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
# Software renderer only: no OpenGL/GPU requirement, small binary, and the exact
# renderer the headless screenshot tests exercise.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "image-default-formats",
] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
# Internal Slint crate used for headless UI tests; it does not follow semver, so pin it.
i-slint-backend-testing = "=1.18.1"
png = "0.18.1"
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
